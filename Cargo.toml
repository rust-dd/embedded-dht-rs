[package]
name = "embedded-dht-rs"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "A driver for interfacing with DHT11, DHT20 (AHT20), DHT22 (AM2302) temperature and humidity sensors, designed for embedded systems."
homepage = "https://github.com/rust-dd/embedded-dht-rs"
documentation = "https://docs.rs/embedded-dht-rs"
repository = "https://github.com/rust-dd/embedded-dht-rs"
readme = "README.md"
keywords = ["embedded", "embedded-hal", "no-std", "dht11", "dht20", "dht22"]
autoexamples = false

[dependencies]
defmt = { version = "1.0.1", optional = true }
embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0.0", optional = true }
maybe-async-cfg = "0.2.5"

[dev-dependencies]
embedded-hal-mock = "0.11.1"

[features]
async = ["dep:embedded-hal-async"]
dht11 = []
dht20 = []
dht22 = []
defmt = ["dep:defmt"]
default = []

[lib]
doctest = false

[profile.release]
codegen-units = 1
lto = true

[package.metadata.docs.rs]
# build docs for all features
all-features = true

[[example]]
name = "embedded-dht-rs-on-esp32"
path = "examples/src/main.rs"
required-features = ["dht11", "dht20", "dht22"]
